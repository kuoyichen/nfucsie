<head>
<meta charset="utf-8">

<style>
:root{
  --coral:#db6a41;--ink:#211d1d;--cream:#fff8f4;--yellow:#fcea8b;--stone:#c5b5a7;--green:#71806a;
  --glass:#86a8a6;--wood:#b48560;--teal:#3e7c8c;--pink:#f2b5c6;--sea:#58a6a6;--indigo:#6f7fb5;
  --panel:rgba(255,250,245,.82);--line:rgba(33,29,29,.1);--muted:#6d625c;
  --shadow:0 1px 2px rgba(74,42,20,.06),0 6px 16px rgba(74,42,20,.08),0 22px 48px rgba(74,42,20,.12);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 40%,#fffdf9,#edddcf);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;outline:none}
#labels{position:fixed;inset:0;pointer-events:none}
#labels>div{pointer-events:none}
.eyebrow{font:700 10px/1.2 var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--coral)}
.big{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700}
.btn{min-height:44px;min-width:44px;border:0;border-radius:9px;background:rgba(255,255,255,.7);padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;transition:background .15s,transform .1s}
.btn:hover{background:var(--yellow)}
.btn[aria-pressed="true"],.btn.on{background:var(--ink);color:#fff}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:#fff;padding:6px 12px;font-size:13px;box-shadow:0 2px 8px #4a2a1414;cursor:pointer;min-height:32px}
.chip.cream{background:var(--cream)}
.chip:hover{background:var(--yellow)}
.glass{background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.6);box-shadow:var(--shadow)}
.hidden{display:none!important}

/* loading */
#loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#fffdf9,#edddcf);transition:opacity .5s}
#loader h1{margin:0;font-size:clamp(30px,6vw,54px);letter-spacing:2px}
#loader h1 span{color:var(--coral)}
#loader p{margin:0;color:var(--muted)}
#loader .hexspin{width:54px;height:54px;background:var(--coral);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);animation:spin 1.6s ease-in-out infinite}
#loader .err{max-width:min(520px,90vw);background:#fff;border-radius:14px;padding:14px 16px;color:#8a2d14;box-shadow:var(--shadow);font-size:14px;white-space:pre-wrap}
@keyframes spin{to{transform:rotate(360deg)}}

/* brand + toolbar */
#brand{position:fixed;left:16px;top:16px;z-index:10;border-radius:18px;padding:12px 16px 12px 12px;display:flex;align-items:center;gap:12px;max-width:340px}
#brand img{width:46px;height:46px;object-fit:contain;border-radius:10px;background:#fff}
#brand .logoFallback{width:46px;height:46px;border-radius:10px;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
#brand h1{margin:0;font-size:19px;line-height:1.2}
#brand .sub{font-size:12px;color:var(--muted)}
#toolbar{position:fixed;left:16px;top:96px;z-index:10;display:flex;gap:8px;border-radius:14px;padding:6px}
#toolbar .btn{flex-direction:column;gap:0;font-size:11px;padding:4px 8px}
#toolbar .btn b{font-size:17px;line-height:1.1}

/* side list */
#side{position:fixed;right:16px;top:16px;bottom:96px;width:318px;z-index:10;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;transition:transform .3s,opacity .3s}
#side.closed{transform:translateX(120%);opacity:0;pointer-events:none}
#side header{padding:14px 14px 8px}
#side input{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);padding:0 12px;font:inherit;background:#fffffff0}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs .btn{flex:1;font-size:13px}
#sideBody{overflow:auto;padding:4px 10px 14px;flex:1}
#sideBody details{background:rgba(255,255,255,.6);border-radius:14px;margin:6px 0;overflow:hidden}
#sideBody summary{cursor:pointer;padding:10px 12px;display:flex;align-items:center;gap:8px;list-style:none;min-height:44px}
#sideBody summary::-webkit-details-marker{display:none}
#sideBody summary .sw{width:14px;height:14px;border-radius:4px;flex:none}
#sideBody summary .no{font:700 11px var(--mono);color:var(--muted)}
#sideBody summary .ttl{flex:1;font-weight:700}
#sideBody summary .cnt{font-size:12px;color:var(--muted)}
#sideBody .row{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:8px 12px;cursor:pointer;font-size:14px;min-height:40px;border-top:1px solid var(--line)}
#sideBody .row:hover{background:var(--yellow)}
#sideBody .row .n{font:700 12px var(--mono);color:var(--coral);width:22px}
#sideBody .row img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#eee}
#sideBody .sec{font:700 10px var(--mono);letter-spacing:2px;color:var(--muted);margin:14px 6px 4px}

/* detail card */
#card{position:fixed;left:16px;top:176px;bottom:96px;width:340px;z-index:11;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,opacity .3s}
#card.closed{transform:translateX(-120%);opacity:0;pointer-events:none}
#card .cardTop{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 0 16px}
#cardBody{overflow:auto;padding:4px 18px 18px;flex:1}
#cardBody h2{margin:6px 0 4px;font-size:22px;line-height:1.25}
#cardBody p{line-height:1.65;margin:8px 0;font-size:14.5px}
#cardBody .icon{font-size:30px}
#cardBody .thumb{width:160px;height:160px;border-radius:18px;background:linear-gradient(#fff,#f3e8dc);display:block;margin:8px auto}
#cardBody ul{padding-left:18px;margin:6px 0}
#cardBody li{margin:4px 0;line-height:1.55;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tile{background:#fff;border-radius:14px;padding:10px 8px;text-align:center;box-shadow:0 2px 8px #4a2a1410}
.tile .big{font-size:24px;color:var(--coral);display:block;line-height:1.1}
.tile small{font-size:11px;color:var(--muted)}
.timeline{display:flex;gap:4px;margin:8px 0 4px}
.timeline span{flex:1;text-align:center;font-size:12px;padding:6px 0;border-radius:8px;background:#fff;color:var(--muted)}
.timeline span.on{background:var(--coral);color:#fff;font-weight:700}
.list{display:flex;flex-direction:column;gap:2px;margin:6px 0}
.list button{display:flex;gap:8px;text-align:left;border:0;background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:14px;min-height:40px;align-items:center}
.list button:hover{background:var(--yellow)}
.list .n{font:700 12px var(--mono);color:var(--coral)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.teacherHead{display:flex;gap:14px;align-items:center;margin-top:6px}
.teacherHead img,.teacherHead .ava{width:84px;height:84px;border-radius:20px;object-fit:cover;background:#f3e8dc;flex:none;box-shadow:0 4px 12px #4a2a1420}
.teacherHead .ava{display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:#fff;background:var(--coral)}
.speech{background:#fff;border-radius:16px;padding:12px 14px;position:relative;margin:12px 0;line-height:1.7;font-size:14.5px;box-shadow:0 2px 8px #4a2a1414}
.speech:before{content:"";position:absolute;left:26px;top:-8px;border:8px solid transparent;border-top:0;border-bottom-color:#fff}
.src{font-size:12px;color:var(--muted);margin-top:14px}
.src a{color:var(--teal)}
.flowHead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;flex-wrap:wrap}

/* hud */
#hud{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;border-radius:999px;padding:6px 10px;display:flex;align-items:center;gap:4px}
#hud .btn{flex-direction:column;gap:0;font-size:11px;padding:2px 8px;border-radius:14px;min-width:50px}
#hud .btn b{font-size:16px;line-height:1.15}
#hud .sep{width:1px;height:30px;background:var(--line);margin:0 4px}
#clock{font:700 18px var(--mono);min-width:66px;text-align:center}
#slotName{font-size:11px;color:var(--muted);text-align:center;max-width:110px;line-height:1.2}
#timeBtn{display:none}

/* journal */
#journal{position:fixed;right:350px;top:16px;width:290px;max-height:44vh;z-index:10;border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
#journal header{display:flex;align-items:center;gap:8px;padding:10px 12px}
#journal .live{width:8px;height:8px;border-radius:50%;background:#3fbf6a;box-shadow:0 0 0 3px #3fbf6a33;animation:pulse 1.6s infinite}
#journal select{flex:1;min-height:34px;border-radius:9px;border:1px solid var(--line);font:inherit;font-size:12px;background:#fff}
#journalList{overflow:auto;padding:0 12px 10px;font-size:12.5px;line-height:1.5}
#journalList div{padding:5px 0;border-top:1px solid var(--line)}
#journalList time{font:700 11px var(--mono);color:var(--coral);margin-right:6px}
@keyframes pulse{50%{opacity:.4}}

/* legend */
#legend{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:9;border-radius:14px;padding:8px 14px;display:flex;gap:16px;font-size:12px;align-items:center}
#legend i{display:inline-block;width:34px;height:0;border-top:3px solid var(--coral);vertical-align:middle;margin-right:6px}
#legend .th i{border-top-style:dashed}
#legend .pe i{border-top-style:dotted}

/* labels */
.ilabel{pointer-events:auto;cursor:pointer;background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px #4a2a1420;display:flex;gap:6px;align-items:center;transition:opacity .2s,background .2s;user-select:none}
.ilabel .no{font:700 11px var(--mono);color:var(--coral)}
.ilabel.sel{background:var(--ink);color:#fff}
.ilabel.sel .no{color:var(--yellow)}
.ilabel.dim{opacity:.45}
.ilabel.compact .nm{display:none}
.pin{pointer-events:auto;cursor:pointer;width:24px;height:24px;border-radius:50%;background:var(--coral);color:#fff;font:700 12px var(--font);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #0003;border:2px solid #fff}
.pin.lit{background:#e8b600}
.tag{pointer-events:auto;cursor:pointer;background:#fff;border:2px solid var(--coral);border-radius:9px;padding:2px 7px;font-size:11.5px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px #4a2a1425;user-select:none}
.tag small{font-weight:400;color:var(--muted);margin-left:2px}
.tag:hover,.tag.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag.sel small,.tag:hover small{color:#ddd}
.bubble{background:#fff;border-radius:10px;padding:3px 8px;font-size:11px;white-space:nowrap;box-shadow:0 2px 6px #4a2a1420;color:var(--ink)}
.say{pointer-events:auto;background:#fff;border-radius:14px;padding:8px 12px;font-size:13px;line-height:1.5;width:240px;white-space:normal;box-shadow:0 6px 18px #4a2a1430;border:2px solid var(--coral)}

/* modal */
#modal{position:fixed;inset:0;z-index:40;background:rgba(33,29,29,.35);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:22px;background:var(--cream);box-shadow:var(--shadow);padding:20px 22px}
#modal h2{margin:4px 0 10px}
#modal ol{padding-left:22px;line-height:1.8}
#modal .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.stat{background:#fff;border-radius:16px;padding:12px 14px}
.stat .big{font-size:30px;color:var(--coral);display:block}
.stat small{color:var(--muted);font-size:12px}
.bars{display:flex;align-items:flex-end;gap:3px;height:140px;padding:8px 4px 0;background:#fff;border-radius:16px;overflow-x:auto}
.bars .b{flex:1;min-width:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.bars .b i{display:block;width:100%;background:var(--coral);border-radius:4px 4px 0 0;min-height:2px}
.bars .b u{display:block;width:100%;background:var(--sea);border-radius:4px 4px 0 0;position:absolute;bottom:18px;min-height:0;opacity:.9}
.bars .b span{font:10px var(--mono);color:var(--muted);height:18px;line-height:18px}
.dayTable{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.dayTable th,.dayTable td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.dayTable th:first-child,.dayTable td:first-child{text-align:left}
.keys{font-size:12px;color:var(--muted);display:flex;gap:14px;margin-top:6px}
.keys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* handles (mobile sheets) */
.handle{display:none}

@media (max-width:800px){
  #brand{left:10px;top:10px;padding:8px 12px 8px 8px;max-width:calc(100vw - 84px)}
  #brand img,#brand .logoFallback{width:36px;height:36px}
  #brand h1{font-size:15px}
  #brand .sub{font-size:11px}
  #toolbar{left:auto;right:10px;top:10px;flex-direction:column;padding:4px}
  #side,#card{left:0;right:0;top:auto;bottom:0;width:auto;border-radius:22px 22px 0 0;transition:transform .3s,opacity .3s,height .2s}
  #side{height:52vh}
  #card{height:34vh}
  #side.closed,#card.closed{transform:translateY(110%)}
  #side.full,#card.full{height:calc(100vh - 70px)}
  .handle{display:block;height:24px;cursor:grab;touch-action:none;flex:none;position:relative}
  .handle:after{content:"";position:absolute;left:50%;top:9px;width:44px;height:5px;border-radius:3px;background:#0002;transform:translateX(-50%)}
  #hud{left:10px;right:auto;bottom:max(10px,env(safe-area-inset-bottom));transform:none;border-radius:16px;flex-wrap:wrap;max-width:calc(100vw - 20px);gap:2px}
  #hud.collapsed>*:not(#timeBtn){display:none}
  #timeBtn{display:inline-flex}
  #journal{right:10px;left:10px;width:auto;top:auto;bottom:150px;max-height:30vh}
  #legend{bottom:70px;font-size:11px;gap:10px;flex-wrap:wrap;max-width:calc(100vw - 20px)}
  .say{width:200px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="stage" aria-label="3D 資工系特色島場景"></div>
<div id="labels"></div>

<div id="loader" role="status">
  <div class="hexspin"></div>
  <h1>虎尾科大 <span>資工島</span></h1>
  <p id="loadMsg" data-en="Assembling the CSIE island…">正在組合資工系特色島…</p>
</div>

<div id="brand" class="glass">
  <img id="logo" alt="虎尾科大資工系 logo" referrerpolicy="no-referrer" src="https://csie.nfu.edu.tw/uploads/site/site_logo/68512a24085777d42a51b3db/%25E8%2599%258E%25E7%25A7%2591%25E5%25A4%25A7-%25E8%25B3%2587%25E5%25B7%25A5%25E7%25B3%25BB-t-w-LOGO-x.png">
  <div>
    <h1 data-en="NFU CSIE Island">虎尾科大資工系特色島</h1>
    <div class="sub" data-en="National Formosa University · Computer Science and Information Engineering">國立虎尾科技大學 · 資訊工程系</div>
  </div>
</div>

<div id="toolbar" class="glass" role="toolbar" aria-label="檢視">
  <button class="btn" id="btnHome" title="全景" data-en-title="Overview"><b>⌂</b><span data-en="Overview">全景</span></button>
  <button class="btn" id="btnList" aria-pressed="true" title="清單" data-en-title="List"><b>☰</b><span data-en="List">清單</span></button>
  <button class="btn" id="btnHelp" title="說明" data-en-title="Help"><b>?</b><span data-en="Help">說明</span></button>
</div>

<aside id="side" class="glass" aria-label="清單">
  <div class="handle" data-sheet="side"></div>
  <header>
    <input id="search" type="search" placeholder="搜尋年級、課程、老師…" data-en-ph="Search cohorts, courses, teachers…" aria-label="搜尋">
    <div class="tabs" role="tablist">
      <button class="btn on" id="tabIslands" role="tab" data-en="Islands">年級島</button>
      <button class="btn" id="tabTeachers" role="tab" data-en="Teachers">老師</button>
      <button class="btn" id="tabFlows" role="tab" data-en="Links">交流線</button>
    </div>
  </header>
  <div id="sideBody"></div>
</aside>

<section id="card" class="glass closed" aria-live="polite">
  <div class="handle" data-sheet="card"></div>
  <div class="cardTop"><span class="eyebrow" id="cardEyebrow"></span><button class="btn" id="cardClose" aria-label="關閉">✕</button></div>
  <div id="cardBody"></div>
</section>

<section id="journal" class="glass hidden" aria-label="島嶼日誌">
  <header><span class="live"></span><span class="eyebrow" style="color:var(--ink)">LIVE</span><b style="font-size:14px" data-en="Island log">島嶼日誌</b>
    <select id="journalFilter" aria-label="篩選交流線"></select></header>
  <div id="journalList"></div>
</section>

<div id="legend" class="glass hidden">
  <span><i></i><span data-en="Official program">正式制度</span></span>
  <span class="th"><i></i><span data-en="Community">社群交流</span></span>
  <span class="pe"><i></i><span data-en="In preparation">籌備進行中</span></span>
</div>

<nav id="hud" class="glass" aria-label="時間與開關">
  <button class="btn" id="timeBtn"><b>◷</b><span data-en="Time">時間</span></button>
  <div><div id="clock">10:00</div><div id="slotName"></div></div>
  <span class="sep"></span>
  <button class="btn" data-time="360"><b>🌅</b><span data-en="Dawn 06">清晨 06</span></button>
  <button class="btn" data-time="720"><b>☀️</b><span data-en="Day 12">白天 12</span></button>
  <button class="btn" data-time="1080"><b>🌇</b><span data-en="Dusk 18">黃昏 18</span></button>
  <button class="btn" data-time="1260"><b>🌙</b><span data-en="Night 21">夜晚 21</span></button>
  <span class="sep"></span>
  <button class="btn" data-tog="names" aria-pressed="true"><b>🏷</b><span data-en="Tags">名牌</span></button>
  <button class="btn" data-tog="carry" aria-pressed="true"><b>🎒</b><span data-en="Carry">搬運</span></button>

//  零件庫 kit：建模函式只推 {kind, matrix, color}，最後每種 kind 一個 InstancedMesh
// ═══════════════════════════════════════════════════════════════════════════
const KIT = { parts: [], geos: {}, meshes: [], owners: new Map(), solid: null, glow: null };

//  六角島、步道、橋、路網
// ═══════════════════════════════════════════════════════════════════════════
function canvasTex(w, h, draw, repeat = true) {

}
function groundTextures() {
  const r = mulberry32(77);

    brick: canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = '#f6efe7'; g.fillRect(0, 0, w, h); g.strokeStyle = '#e6d8ca'; g.lineWidth = 3;
      for (let y = 0; y < h; y += 32) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); for (let x = (y / 32 % 2) * 32; x < w; x += 64) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 32); g.stroke(); } }

}
function hexRingGeo(inner, outer, cx, cz, y, color, list) {

    const [ix, iz] = hexCorner(inner, i, cx, cz), [ox, oz] = hexCorner(outer, i, cx, cz);

function initIslands() {
  const tex = groundTextures();

  const cream = col(PAL.cream);
  DATA.islands.forEach((d, idx) => {
    const { x, z } = axialToWorld(d.q, d.r);
    const isl = { d, idx, x, z, items: [], color: col(d.color), nodes: [], label: null };
    ISL[d.id] = isl;
    // 島面
    const top = new THREE.CircleGeometry(R - 0.05, 6).rotateZ(Math.PI / 6).rotateX(-Math.PI / 2).translate(x, TOP, z);
    const p = top.attributes.position, uv = top.attributes.uv, cs = [];
    const tint = cream.clone().lerp(isl.color, .32);
    for (let i = 0; i < p.count; i++) { uv.setXY(i, p.getX(i) / 2.2, p.getZ(i) / 2.2); cs.push(tint.r, tint.g, tint.b); }
    top.setAttribute('color', new THREE.Float32BufferAttribute(cs, 3));

    // 側壁（與水同 shader）
    const hgt = TOP - (WATER_Y - 0.6);

    // 頂緣彩色圖案帶
    const band = new THREE.CylinderGeometry(R + 0.006, R + 0.006, 0.16, 6, 1, true).translate(x, TOP - 0.08, z);
    const bu = band.attributes.uv, bc = [];
    for (let i = 0; i < bu.count; i++) { bu.setX(i, bu.getX(i) * 18); bc.push(isl.color.r, isl.color.g, isl.color.b); }

    // 淺水環、泡沫環

const GROUND = [];

// 路網：每島 12 節點（步道六角 6 角點 + 6 邊中點）成環；橋連接相鄰島
const NET = { nodes: [], adj: [], bridges: [] };

}
function initNetwork() {
  for (const id in ISL) {
    const s = ISL[id];

      const c = k >> 1;

    const A = NET.nodes[a.nodes[ka]], B = NET.nodes[b.nodes[kb]];

function buildBridges() {

// 島名標籤（CSS2D，掛在前側崖邊）

const LABELS = [];

// ═══════════════════════════════════════════════════════════════════════════
//  主迴圈與啟動
// ═══════════════════════════════════════════════════════════════════════════

  const d = camera.position.distanceTo(controls.target);

  for (const m of KIT.meshes) if (m.userData.small) m.visible = d < 26;
  if (typeof updateWalkerVisibility === 'function') updateWalkerVisibility(d);

}
let lastSlot = null;

  if (typeof onSlotMaybeChanged === 'function') onSlotMaybeChanged();
}

}
async function boot() {
